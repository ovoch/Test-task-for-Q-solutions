ServerName localhost
Timeout 300
WSGISocketPrefix /var/run/apache2/wsgi

<VirtualHost *:80>
    ServerName localhost

    WSGIDaemonProcess video_service processes=1 threads=8 home=/app display-name=%{GROUP}
    WSGIProcessGroup video_service
    WSGIApplicationGroup %{GLOBAL}
    WSGIImportScript /app/app.wsgi process-group=video_service application-group=%{GLOBAL}
    WSGIScriptAlias / /app/app.wsgi

    <Directory /app>
        Require all granted
    </Directory>

    ErrorLog ${APACHE_LOG_DIR}/error.log
    CustomLog ${APACHE_LOG_DIR}/access.log combined
</VirtualHost>
